      user-select: none;

      animation: fall linear infinite;

    @keyframes fall {
      0% {
        top: -5vh;

      }
      50% {
        /* Féltávnál kap egy kis oldalirányú kilengést (szél) és pördülést */

      document.body.appendChild(flake);

      flakes.push(flake);
    }
  }

  // Kezdeti hópelyhek száma

    const count = Number(slider.value);
